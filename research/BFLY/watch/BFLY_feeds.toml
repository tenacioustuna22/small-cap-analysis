[[source]]
name = "News: Midjourney medical"
item = "W3"
kind = "google_news"
query = 'Midjourney (medical OR ultrasound OR scanner OR spa OR health OR patent OR hardware)'
title_must = '^(?=.*Midjourney)(?=.*(medical|ultrasound|scan|spa\b|health|patent|hardware|body|imaging|FDA))'

[[source]]
name = "News: Midjourney lawsuit"
item = "W3"
kind = "google_news"
query = 'Midjourney (Disney OR Universal OR "Warner Bros") lawsuit'
title_must = '^(?=.*Midjourney)(?=.*(Disney|Universal|Warner|lawsuit|sues?\b|sued|court|copyright|judge|ruling|settle|trial|injunction))'

[[source]]
name = "News: Midjourney finances"
item = "W3"
kind = "google_news"
query = 'Midjourney (revenue OR funding OR raises OR valuation OR layoffs OR investors)'
title_must = '^(?=.*Midjourney)(?=.*(revenue|funding|rais|valuation|layoff|investor|subscri|profit))'

# The two dockets, entry by entry with the court's description, through the CourtListener API
# (the web pages refuse automated reads and the search feed has no descriptions; 2026-11-23).
# Two sources over the same entries: court rulings are sent now; everything else (several
# filings a week) waits for the Saturday run. The rulings source must come first, so the second
# skips what it logged. Routine orders (sealing, scheduling, admissions) wait for Saturday.
[[source]]
name = "Court dockets: rulings"
item = "W3"
kind = "courtlistener"
dockets = [
  { id = 70513159, name = "Disney v. Midjourney (C.D. Cal. 2:25-cv-05275)" },
  { id = 73698332, name = "EVOX v. Midjourney" },
]
title_must = '^(?!.*(under seal|pro hac vice|changing the time|scheduling|set/reset|proof of service)).*(#\d+|unnumbered): (\(in chambers\) )?(order|minutes|judgment|notice of settlement|stipulation.*dismiss)'
match_titles = false

[[source]]
name = "Court dockets: all filings"
item = "W3"
kind = "courtlistener"
dockets = [
  { id = 70513159, name = "Disney v. Midjourney (C.D. Cal. 2:25-cv-05275)" },
  { id = 73698332, name = "EVOX v. Midjourney" },
]
notify = "weekend"
match_titles = false

