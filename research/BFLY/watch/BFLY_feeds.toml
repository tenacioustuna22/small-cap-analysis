# EDGAR company search, 2026-11-20: none of the partners files under its own name. "Merge Labs,
# Inc." (CIK 1675206) is an unrelated 2016 San Antonio company. Investment vehicles named after a
# partner do file Form Ds: "MERGE LABS Sep 2025 a Series of CGF2021 LLC" (2025-12-16) and
# "Gaingels Sonic Incytes 2025 LLC" (2025-10-07, $109,844 from 15 investors). Full-text search
# finds those, with the amounts read from each Form D. Five requests a run.
[[source]]
name = "EDGAR: Form D naming a partner"
item = "W2"
kind = "sec_fulltext"
queries = ["Merge Labs", "Bridge Neurotech", "Mendaera", "Sonic Incytes", "Aleph Neuro", "Forest Neurotech"]
forms = ["D"]

