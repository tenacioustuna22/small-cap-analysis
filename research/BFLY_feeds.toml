# EDGAR company search, 2026-11-20: none of the partners files under its own name. "Merge Labs,
# Inc." (CIK 1675206) is an unrelated 2016 San Antonio company. "MERGE LABS Sep 2025 a Series of
# CGF2021 LLC" (CIK 2101077) is an investment vehicle that bought into Merge Labs (Form D filed
# 2025-12-16). Partner raises still reach the free check through the news queries.
[[weekend_only]]
item = "W2"
