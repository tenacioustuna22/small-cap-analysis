# Feeds for the free watchlist check (scripts/watch_check.py), read twice a day by
# .github/workflows/watch-check.yml. Items refer to research/BFLY_watch.md (W1-W7).
#
# Top level
#   ticker, baseline_date     entries published before baseline_date are ignored
#   [promote]                 a title matching `title` is filed under `item`, whatever the source
#   [filters]                 blocked_domains (and their subdomains); blocked_titles (regexes)
#   [[weekend_only]]          checks with no working free feed; the weekend Claude run does them
#
# [[source]] keys
#   name                      unique label; it appears in the seen-log and the issue
#   item                      W1..W7
#   kind                      rss | google_news | sec_8k | sec_form_d | sec_earnings | correlation
#   notify                    "now" (Claude reports on it in the same run, the default) or
#                             "weekend" (logged; Claude reads it in the Saturday run)
#   title_must                optional regex the title must match (case-insensitive)
#   match_titles              de-duplicate on the title as well as the URL (default true;
#                             false for feeds whose titles repeat, such as a court docket)
#   rss: url | google_news: query (searched over the last 7 days)
#   sec_8k: ticker, items | sec_form_d: company, cik | sec_earnings: tickers
#   correlation: ticker, benchmark, window (days, 60), low (0.3), move (0.2); weekend runs only
#
# Titles are matched case-insensitively. To silence a noisy source, tighten its title_must
# before deleting it.

ticker = "BFLY"
baseline_date = 2026-11-18

[promote]
title = 'Butterfly Network|Ultrasound-on-Chip|Butterfly Embedded'
item = "W1"

[filters]
blocked_domains = [
  "simplywall.st", "stocktitan.net", "marketbeat.com", "zacks.com", "gurufocus.com",
  "marketscreener.com", "otcmarkets.com", "tradersunion.com", "globalbankingandfinance.com",
  "tipranks.com", "insidermonkey.com", "defenseworld.net", "etfdailynews.com",
  "americanbankingnews.com", "tickerreport.com", "investorsobserver.com", "stockstory.org",
  "felloai.com",
]
blocked_titles = [
  'stock price, news, quote',
  '\b(falls|rises|gains|drops|slips|climbs|jumps|soars|plunges|sinks|tumbles|surges|up|down)\b [\d.]+%',
  'price target',
  '\b(upgraded|downgraded|upgrades|downgrades|initiates coverage|reiterated)\b',
  'short interest',
  '\b(shares|stock|stake|position)\b.*\b(sold|bought|acquired|purchased|raised|lowered|trimmed|boosted|increased|decreased) by\b',
  'insider (selling|buying|sells|buys|sold|bought)',
  '\bhow to buy\b',
  # insider trades are covered by the Form 4 section of scripts/report.py
  '\bForm (4|144)\b',
  '\b(sells|buys|sold|bought) \$[\d.,]+ ?[MKB]?\w* (in|of|worth)\b',
]

