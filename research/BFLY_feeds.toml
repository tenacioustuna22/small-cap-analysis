[[source]]
name = "News: Midjourney lawsuit"
item = "W3"
kind = "google_news"
query = 'Midjourney (Disney OR Universal OR "Warner Bros") lawsuit'
title_must = '^(?=.*Midjourney)(?=.*(Disney|Universal|Warner|lawsuit|sues?\b|sued|court|copyright|judge|ruling|settle|trial|injunction))'

[[source]]
