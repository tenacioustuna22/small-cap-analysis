# Watchlist check: a free feed check twice a day, a fast lane every 15 minutes on weekdays, and
# Claude reports only when something is found.
#
# 1. scripts/watch_check.py reads research/<TICKER>/watch/<TICKER>_feeds.toml (no Claude usage)
#    and logs new items in research/<TICKER>/watch/<TICKER>_seen.csv.
# 2. If anything is waiting, it opens an issue labelled "watch", and Claude (Opus, on the owner's
#    subscription) follows research/watch_agent_prompt.md and writes
#    research/<TICKER>/watch/reports/<TICKER>_<day>_<am|pm|weekend|HHMM>.md.
# 3. The report is posted as a comment on the issue, the items are marked reported and
#    everything is committed.
#
# Who starts the runs: an outside scheduler (cron-job.org), through the API's workflow_dispatch,
# because GitHub's own schedule is best effort and ran 4 to 11 hours late from 2026-11-21 to
# 2026-11-23 (the fast lane started 1 of 44 runs on 2026-11-23). A run started that way begins
# within seconds. The cron-job.org jobs, in their own time zones:
#   now      6:30 am Pacific, Sunday to Friday
#   now      1:30 pm Pacific, every day
#   weekend  7:00 am Pacific, Saturday (court docket, W7)
#   fast     every 15 minutes from 6:07 am to 4:52 pm Eastern, Monday to Friday: only sources
#            marked `fast = true` in the feeds files (BFLY's press releases and 8-Ks). Its report
#            file is named by the Pacific time, for example _0637.
# GitHub's schedule below stays as a backup for the three main runs. When it fires late it finds
# nothing new and stays quiet, a report never overwrites an earlier one (a second gets -2), and
# the Saturday backup skips itself when that day's weekend report exists.
# The scheduler's token is a fine-grained one for this repo only, with Actions read and write.
#
# Repo secrets: SEC_USER_AGENT (name and contact email for EDGAR), COURTLISTENER_TOKEN (a free
# CourtListener account's API token) and CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
#
# All runs share one concurrency group, so two never edit the seen-log at once. GitHub keeps only
# one waiting run per group; if runs pile up, a waiting one is dropped. Nothing is lost: the
# seen-log is the record, and the next run picks up whatever is still new.
name: Watchlist check

on:
  schedule:
    # Backup only (UTC; see above). 14:30 and 21:30 are 6:30 am and 1:30 pm Pacific in winter.
    - cron: "30 14 * * 0-5"   # mornings except Saturday
    - cron: "30 21 * * *"     # afternoons
    - cron: "17 15 * * 6"     # Saturday: weekend run (off the hour: GitHub drops on-the-hour runs)
  workflow_dispatch:
    inputs:
      mode:
        description: "now = flagged items only; weekend = the Saturday run; fast = fast lane only"
        type: choice
        options: [now, weekend, fast]
        default: now

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: watch-check
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Mode and report name
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then mode="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "17 15 * * 6" ]; then mode=weekend
          else mode=now; fi
          day="$(TZ=America/Los_Angeles date +%F)"
          # A late scheduled run keeps the name of the slot it was scheduled for (GitHub started
          # the 6:30 am run at 5:47 pm on 2026-11-23).
          if [ "$mode" = weekend ]; then slot=weekend
          elif [ "$mode" = fast ]; then slot="$(TZ=America/Los_Angeles date +%H%M)"
          elif [ "${{ github.event.schedule }}" = "30 14 * * 0-5" ]; then slot=am
          elif [ "${{ github.event.schedule }}" = "30 21 * * *" ]; then slot=pm
          elif [ "$(TZ=America/Los_Angeles date +%-H)" -lt 12 ]; then slot=am
          else slot=pm; fi
          # Never overwrite an earlier report of the same day and slot.
          base="$slot"; n=2
          while ls research/*/watch/reports/*_"$day"_"$slot".md >/dev/null 2>&1; do
            slot="${base}-$n"; n=$((n + 1))
          done
          # The weekend run always reports, so GitHub's backup skips a Saturday already covered.
          if [ "${{ github.event_name }}" = schedule ] && [ "$mode" = weekend ] && [ "$slot" != weekend ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          # Claude's instructions know "now" and "weekend"; a fast-lane run is a "now" run.
          if [ "$mode" = weekend ]; then echo "claude_mode=weekend" >> "$GITHUB_OUTPUT"
          else echo "claude_mode=now" >> "$GITHUB_OUTPUT"; fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "day=$day" >> "$GITHUB_OUTPUT"

      - name: Free check
        id: check
        if: steps.mode.outputs.skip != 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python scripts/watch_check.py --mode ${{ steps.mode.outputs.mode }} --issue-body watch_out/issue.md

      - name: Save the seen-log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in research/*/watch/*_seen.csv research/*/watch/*_watch_state.json; do [ ! -e "$f" ] || git add "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m "Watch check ${{ steps.mode.outputs.day }} ${{ steps.mode.outputs.slot }}: log new items"
            git pull --rebase && git push
          fi

      - name: Open the issue
        id: issue
        if: steps.check.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create watch --color 1D76DB --description "Watchlist check" --force
          url=$(gh issue create --label watch --body-file watch_out/issue.md \
            --title "Watch ${{ steps.check.outputs.tickers }}: ${{ steps.mode.outputs.day }} ${{ steps.mode.outputs.slot }}")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Claude's report
        if: steps.check.outputs.has_new == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Read research/watch_agent_prompt.md and follow it.
            Mode: ${{ steps.mode.outputs.claude_mode }}
            Tickers: ${{ steps.check.outputs.tickers }}
            Waiting items: watch_out/issue.md
            Report file for each ticker: research/<TICKER>/watch/reports/<TICKER>_${{ steps.mode.outputs.day }}_${{ steps.mode.outputs.slot }}.md
          claude_args: >-
            --model opus
            --max-turns 40
            --allowedTools "Read,Write,Glob,Grep,WebFetch,WebSearch"

      - name: Post the report and mark items reported
        if: always() && steps.check.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="${{ steps.mode.outputs.day }}"; slot="${{ steps.mode.outputs.slot }}"
          : > watch_out/comment.md
          missing=""
          for t in ${{ steps.check.outputs.tickers }}; do
            f="research/${t}/watch/reports/${t}_${day}_${slot}.md"
            if [ -f "$f" ]; then
              cat "$f" >> watch_out/comment.md
              printf '\n\nFile: https://github.com/${{ github.repository }}/blob/main/%s\n\n' "$f" >> watch_out/comment.md
            else
              missing="$missing $t"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Claude's report did not arrive for:$missing. Those items stay new and go to the next run. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> watch_out/comment.md
          fi
          # GitHub mobile pushes mentions reliably, but not new issues in a watched repo.
          printf 'cc @%s\n' "${{ github.repository_owner }}" >> watch_out/comment.md
          gh issue comment "${{ steps.issue.outputs.number }}" --body-file watch_out/comment.md
          reported=""
          for t in ${{ steps.check.outputs.tickers }}; do
            case " $missing " in *" $t "*) ;; *) reported="$reported $t";; esac
          done
          if [ -n "$reported" ]; then
            python scripts/watch_check.py $reported --mode ${{ steps.mode.outputs.mode }} --mark-reported
          fi
          for f in research/*/watch/reports research/*/watch/*_seen.csv; do [ ! -e "$f" ] || git add "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m "Watch report $day $slot:${reported:- none}"
            git pull --rebase && git push
          fi
          [ -z "$missing" ]
